    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <p class="logo">
            <span aria-hidden="true">📷</span> Photoland

        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="#" aria-current="page">Explore</a></li>

        <form class="search-form" role="search">
            <label for="search-input" class="visually-hidden">Search photos</label>
            <input type="search" id="search-input" name="q" placeholder="Search photos...">
            <button type="submit">Search</button>
        </form>
    </header>

                                <li><a href="#">nature</a></li>
                                <li><a href="#">sunset</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
