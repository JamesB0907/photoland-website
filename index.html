<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoland</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
        <p class="logo">
            <span aria-hidden="true">📷</span> Photoland
        </p>

        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="#" aria-current="page">Explore</a></li>
                <li><a href="#">Popular</a></li>
                <li><a href="#">Groups</a></li>
                <li><a href="#">Upload</a></li>
            </ul>
        </nav>

        <form class="search-form" role="search">
            <label for="search-input" class="visually-hidden">Search photos</label>
            <input type="search" id="search-input" name="q" placeholder="Search photos...">
            <button type="submit">Search</button>
        </form>
    </header>

    <main id="main-content">
        <section class="hero">
            <h1 id="page-header">
                <span id="header-text">Welcome to Photoland!</span>
            </h1>
            <p>Share your world, one photo at a time.</p>
        </section>

        <div class="page-layout">
            <section class="gallery" aria-labelledby="gallery-heading">
                <h1 id="gallery-heading">Recent Uploads</h1>

                <div class="photo-grid">

                    <figure class="photo-card">
                        <img src="images/mountain-sunset.jpg" alt="A sun setting over a mountain">
                        <figcaption>
                            <h3>Mountain Sunset</h3>
                            <p class="photographer"> by <a href="#">Jack Brauer</a></p>
                            <ul class="tags">
                                <li><a href="#">nature</a></li>
                                <li><a href="#">sunset</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/grizzly-bear.webp" alt="two grizzly bear cubs playfighting">
                        <figcaption>
                            <h3>Grizzly Bears</h3>
                            <p class="photographer"> by <a href="#">Ron Niebrugge</a></p>
                            <ul class="tags">
                                <li><a href="#">animals</a></li>
                                <li><a href="#">nature</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/highland-cow.avif" alt="highland cow with long bangs">
                        <figcaption>
                            <h3>Highland Cow</h3>
                            <p class="photographer"> by <a href="#">Nimisha Mekala</a></p>
                            <ul class="tags">
                                <li><a href="#">animals</a></li>
                                <li><a href="#">rural</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/farmhouse-snow.jpg" alt="snow covered farmhouse appalachia">
                        <figcaption>
                            <h3>Snowy Farmhouse</h3>
                            <p class="photographer"> by <a href="#">Tim Pennington</a></p>
                            <ul class="tags">
                                <li><a href="#">rural</a></li>
                                <li><a href="#">nature</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/tokyo-skyline.jpg" alt="tokyo skyline">
                        <figcaption>
                            <h3>Tokyo Skyline</h3>
                            <p class="photographer"> by <a href="#">Unknown</a></p>
                            <ul class="tags">
                                <li><a href="#">urban</a></li>
                                <li><a href="#">scenic</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/buddha-statue.jpg" alt="high angle buddha statue">
                        <figcaption>
                            <h3>Buddha Statue</h3>
                            <p class="photographer"> by <a href="#">Unknown</a></p>
                            <ul class="tags">
                                <li><a href="#">scenic</a></li>
                                <li><a href="#">landmark</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/lake-photo.jpg" alt="photo of lake and surrounding forest">
                        <figcaption>
                            <h3>Lake</h3>
                            <p class="photographer"> by <a href="#">Unknown</a></p>
                            <ul class="tags">
                                <li><a href="#">nature</a></li>
                                <li><a href="#">water</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                    <figure class="photo-card">
                        <img src="images/fountain-city.jpg" alt="image of a fountain in a city">
                        <figcaption>
                            <h3>City Fountain</h3>
                            <p class="photographer"> by <a href="#">Daniel Avila</a></p>
                            <ul class="tags">
                                <li><a href="#">urban</a></li>
                                <li><a href="#">water</a></li>
                            </ul>
                            <p class="stats">
                                <span class="stat"><span aria-hidden="true">❤</span>128 likes</span>
                                <span class="stat"><span aria-hidden="true">👁</span>2.4k views</span>
                            </p>
                        </figcaption>
                    </figure>

                </div>
            </section>

            <aside class="trending" aria-labelledby="trending-heading">
                <h2 id="trending-heading">Trending Tags</h2>
                <ul class="tag-cloud">
                    <li><a href="#">nature</a></li>
                    <li><a href="#">scenic</a></li>
                    <li><a href="#">urban</a></li>
                    <li><a href="#">rural</a></li>
                    <li><a href="#">animals</a></li>
                    <li><a href="#">water</a></li>
                </ul>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; <time datetime="2026">2026</time> Photoland &mdash; a class project.</p>
    </footer>
</body>

</html>
